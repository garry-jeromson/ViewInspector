name: iOS repeat

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    name: iOS full suite (${{ matrix.copy }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b, c]
    env:
      TEST_RUNNER_VIEWINSPECTOR_TEST_TIMEOUT_SCALE: 50
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Test
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project ViewInspector.xcodeproj -scheme ViewInspector-Package -destination "id=$DEST" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 2>&1 | tee test.log \
            | grep --line-buffered -E " error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|timed out" | tail -20
      - name: Failing tests
        if: always()
        run: |
          grep -E "Executed [0-9]+ tests" test.log | tail -1 || true
          grep -E "error: -\[" test.log | awk -F': error: ' '{print $2}' | sort -u | head -40 || true
